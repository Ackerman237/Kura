<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" width="100%" height="100%">
  <!-- Kura (蔵) Horizontal Brand Lockup (Header / Navbar) -->
  <defs>
    <linearGradient id="kuraLockupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0714E" />
      <stop offset="100%" stop-color="#E8613C" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (48x48) -->
  <g transform="translate(12, 12)">
    <!-- Hexagon with negative space play button -->
    <path
      fill="url(#kuraLockupGrad)"
      fill-rule="evenodd"
      d="
        M 24,0
        L 44.78,12
        L 44.78,36
        L 24,48
        L 3.22,36
        L 3.22,12
        Z
        M 20.5,16.5
        C 20.5,15.5 21.6,14.8 22.5,15.3
        L 32.5,23.1
        C 33.3,23.7 33.3,24.9 32.5,25.5
        L 22.5,33.3
        C 21.6,33.8 20.5,33.1 20.5,32.1
        Z
      "
    />
  </g>

  <!-- Typography: Wordmark "KURA" in Washi White -->
  <text
    x="76"
    y="44"
    fill="#ECE8E1"
    font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif"
    font-size="30"
    font-weight="800"
    letter-spacing="2.5"
  >KURA</text>

  <!-- Kanji "蔵" in Vermilion Red -->
  <text
    x="196"
    y="44"
    fill="#E8613C"
    font-family="'Shippori Mincho', 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif"
    font-size="26"
    font-weight="700"
  >蔵</text>

  <!-- Divider Line -->
  <line
    x1="236"
    y1="22"
    x2="236"
    y2="46"
    stroke="#33363E"
    stroke-width="1.5"
  />

  <!-- Tagline / Subtitle in Muted Washi -->
  <text
    x="248"
    y="33"
    fill="#ECE8E1"
    font-family="'Inter', system-ui, sans-serif"
    font-size="11"
    font-weight="600"
    letter-spacing="0.5"
  >MEDIA STOREHOUSE</text>
  <text
    x="248"
    y="46"
    fill="#A8A59F"
    font-family="'Inter', system-ui, sans-serif"
    font-size="9.5"
    font-weight="400"
    letter-spacing="0.4"
  >Manga Reader &amp; Cinema</text>
</svg>
