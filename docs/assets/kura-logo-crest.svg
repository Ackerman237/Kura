<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Kura (蔵) Official Crest / Primary Mark -->
  <!-- Geometric Kikkō Mon + Manga Panels + Play Button -->
  <defs>
    <linearGradient id="crestVermilion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F27755" />
      <stop offset="100%" stop-color="#E8613C" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E8613C" flood-opacity="0.2" />
    </filter>
  </defs>

  <g filter="url(#subtleGlow)">
    <!-- Outer Hexagonal Frame (Kikkō Border) -->
    <polygon
      points="120,18 206.6,68 206.6,168 120,218 33.4,168 33.4,68"
      fill="none"
      stroke="url(#crestVermilion)"
      stroke-width="5"
      stroke-linejoin="round"
    />

    <!-- Middle Concentric Hexagon -->
    <polygon
      points="120,44 182.8,80.2 182.8,155.8 120,192 57.2,155.8 57.2,80.2"
      fill="none"
      stroke="url(#crestVermilion)"
      stroke-width="3.5"
      stroke-linejoin="round"
      stroke-opacity="0.85"
    />

    <!-- Inner Core Hexagon (Inner Sanctum / Storehouse) -->
    <polygon
      points="120,68 161.6,92 161.6,144 120,168 78.4,144 78.4,92"
      fill="#17181C"
      stroke="url(#crestVermilion)"
      stroke-width="3"
      stroke-linejoin="round"
    />

    <!-- Manga Panel Partition Lines (Connecting Outer to Middle Hexagon) -->
    <!-- Top vertex & edges -->
    <line x1="120" y1="18" x2="120" y2="44" stroke="url(#crestVermilion)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="206.6" y1="68" x2="182.8" y2="80.2" stroke="url(#crestVermilion)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="206.6" y1="168" x2="182.8" y2="155.8" stroke="url(#crestVermilion)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="120" y1="218" x2="120" y2="192" stroke="url(#crestVermilion)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="33.4" y1="168" x2="57.2" y2="155.8" stroke="url(#crestVermilion)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="33.4" y1="68" x2="57.2" y2="80.2" stroke="url(#crestVermilion)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Subdividing Panel Struts (Middle to Inner Hexagon) -->
    <line x1="120" y1="44" x2="120" y2="68" stroke="url(#crestVermilion)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="182.8" y1="80.2" x2="161.6" y2="92" stroke="url(#crestVermilion)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="182.8" y1="155.8" x2="161.6" y2="144" stroke="url(#crestVermilion)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="120" y1="192" x2="120" y2="168" stroke="url(#crestVermilion)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="57.2" y1="155.8" x2="78.4" y2="144" stroke="url(#crestVermilion)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="57.2" y1="80.2" x2="78.4" y2="92" stroke="url(#crestVermilion)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Center Play Button (Media Heartbeat) -->
    <path
      d="
        M 108,98
        C 108,95.5 110.8,94 113,95.2
        L 142.5,116.2
        C 144.5,117.4 144.5,120.6 142.5,121.8
        L 113,142.8
        C 110.8,144 108,142.5 108,140
        Z
      "
      fill="url(#crestVermilion)"
    />
  </g>
</svg>
