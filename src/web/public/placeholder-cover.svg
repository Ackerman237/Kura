<svg viewBox="0 0 400 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="No Cover Available">
  <defs>
    <linearGradient id="kuraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117" />
      <stop offset="100%" stop-color="#151821" />
    </linearGradient>

    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="560" fill="url(#kuraBg)" />

  <!-- Subtle Ambient Glow -->
  <g filter="url(#ambientGlow)">
    <circle cx="200" cy="220" r="110" fill="#d97706" fill-opacity="0.12" />
    <circle cx="200" cy="380" r="90" fill="#1e293b" fill-opacity="0.4" />
  </g>

  <!-- Central Frosted Glass Card -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="90" width="300" height="380" rx="16" fill="#161922" fill-opacity="0.72" stroke="url(#glassBorder)" stroke-width="1.2" />
  </g>

  <!-- Book / Cover Icon -->
  <g transform="translate(200, 210)">
    <rect x="-38" y="-42" width="76" height="84" rx="12" fill="#1e222d" stroke="url(#glassBorder)" stroke-width="1" />
    <!-- Book Spine & Pages -->
    <path d="M -18, -18 C -10,-21 -3,-21 0,-16 C 3,-21 10,-21 18,-18 L 18, 16 C 10,13 3,13 0, 18 C -3,13 -10,13 -18, 16 Z" fill="none" stroke="url(#amberAccent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="0" y1="-16" x2="0" y2="18" stroke="url(#amberAccent)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Text Hierarchy -->
  <text x="200" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="2.5">NO COVER</text>
  <text x="200" y="352" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#9ca3af" letter-spacing="0.5">Sampul Tidak Tersedia</text>

  <!-- Minimal Brand Tag -->
  <rect x="160" y="390" width="80" height="22" rx="11" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <text x="200" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#d97706" letter-spacing="1.5">KURA</text>

  <!-- Outer Border -->
  <rect x="0.5" y="0.5" width="399" height="559" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
</svg>
