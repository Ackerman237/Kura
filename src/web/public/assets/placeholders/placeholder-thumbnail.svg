<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Thumbnail disembunyikan, mode pengembangan" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="stripes-thumb" width="40" height="40" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#0B0A0D"/>
      <rect width="2" height="40" fill="#8E3154" opacity="0.07"/>
    </pattern>
    <radialGradient id="glow-thumb" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1A171D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B0A0D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#stripes-thumb)"/>
  <rect width="640" height="360" fill="url(#glow-thumb)"/>
  <rect x="1" y="1" width="638" height="358" fill="none" stroke="#F2EEE3" stroke-opacity="0.08" stroke-width="1"/>

  <!-- DEV badge -->
  <g transform="translate(16,16)">
    <rect width="52" height="24" rx="12" fill="#8E3154" fill-opacity="0.16"/>
    <text x="26" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5" fill="#C96E90">DEV</text>
  </g>

  <!-- play glyph -->
  <g transform="translate(320,150)">
    <circle r="28" fill="#121014" stroke="#F2EEE3" stroke-opacity="0.15"/>
    <path d="M-8 -14 L16 0 L-8 14 Z" fill="#7D7783"/>
  </g>

  <text x="320" y="222" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" letter-spacing="2" fill="#F2EEE3">NOCTRA</text>
  <text x="320" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#A9A3A9">Thumbnail disembunyikan</text>
  <text x="320" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7D7783">Mode pengembangan</text>
</svg>
