<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kura Cinema Thumbnail Placeholder">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F17" />
      <stop offset="50%" stop-color="#141624" />
      <stop offset="100%" stop-color="#191B2C" />
    </linearGradient>

    <!-- Kura Brand Gradient -->
    <linearGradient id="kuraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7654" />
      <stop offset="100%" stop-color="#E8613C" />
    </linearGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#E8613C" stop-opacity="0.25" />
    </linearGradient>

    <!-- Ambient Blur Filters -->
    <filter id="ambientBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="65" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 1. Deep Atmosphere Base -->
  <rect width="640" height="360" fill="url(#bgGrad)" />

  <!-- 2. Ambient Blurred Light Orbs (Noctra-Free Soft Glass Glow) -->
  <g filter="url(#ambientBlur)">
    <!-- Warm Vermilion Glow (Top-Right) -->
    <circle cx="480" cy="100" r="130" fill="#E8613C" fill-opacity="0.2" />
    <!-- Deep Indigo Glow (Bottom-Left) -->
    <circle cx="160" cy="260" r="140" fill="#4F46E5" fill-opacity="0.18" />
    <!-- Subtle Cyan Accent (Center) -->
    <circle cx="320" cy="180" r="80" fill="#0EA5E9" fill-opacity="0.1" />
  </g>

  <!-- 3. Giant Kura Kanji Watermark (Subtle Brand Aura) -->
  <text x="320" y="235" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="210" font-weight="900" fill="#FFFFFF" fill-opacity="0.022" letter-spacing="-6">蔵</text>

  <!-- 4. Subtle Ambient Grid Mesh Pattern -->
  <g stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="0" y1="90" x2="640" y2="90" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="270" x2="640" y2="270" />
  </g>

  <!-- 5. Central Frosted Glass Container -->
  <g filter="url(#cardShadow)">
    <rect x="180" y="55" width="280" height="250" rx="20" fill="#151726" fill-opacity="0.65" stroke="url(#glassBorder)" stroke-width="1.2" />
    <!-- Glass Highlight Sheen (Top Curve) -->
    <path d="M 181,75 A 20,20 0 0,1 201,56 L 439,56 A 20,20 0 0,1 459,75 L 459,105 C 390,88 250,92 181,105 Z" fill="#FFFFFF" fill-opacity="0.04" />
  </g>

  <!-- 6. Category Pill Badge -->
  <g transform="translate(320, 92)">
    <rect x="-56" y="-12" width="112" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
    <circle cx="-38" cy="0" r="4" fill="#E8613C" />
    <text x="-26" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0" letter-spacing="1">CINEMA</text>
  </g>

  <!-- 7. Central Video Play Hexagon Emblem (Kura Crest Motif) -->
  <g transform="translate(320, 160)">
    <!-- Hexagon Outer Aura Glow -->
    <polygon points="0,-42 36.4,-21 36.4,21 0,42 -36.4,21 -36.4,-21" fill="#E8613C" fill-opacity="0.25" filter="url(#softGlow)" />
    <!-- Hexagon Outer Stroke -->
    <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#12131F" fill-opacity="0.8" stroke="url(#kuraGradient)" stroke-width="2.2" stroke-linejoin="round" />
    <!-- Modern Video Play Triangle -->
    <path d="M -7,-14 C -7,-16.2 -4.6,-17.6 -2.7,-16.4 L 14.8,-5.4 C 16.6,-4.2 16.6,-1.8 14.8,-0.6 L -2.7,10.4 C -4.6,11.6 -7,10.2 -7,8 Z" fill="url(#kuraGradient)" />
  </g>

  <!-- 8. Typography & State Label -->
  <text x="320" y="246" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#FFFFFF">K U R A</text>
  <text x="320" y="270" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#94A3B8" letter-spacing="0.5">Pratinjau Video Sinema</text>

  <!-- Outer Border Frame -->
  <rect x="0.5" y="0.5" width="639" height="359" rx="0" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />
</svg>
