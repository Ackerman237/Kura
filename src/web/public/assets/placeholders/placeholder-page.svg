<svg viewBox="0 0 500 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Halaman disembunyikan, mode pengembangan" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="stripes-page" width="40" height="40" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#0B0A0D"/>
      <rect width="2" height="40" fill="#8E3154" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="500" height="720" fill="url(#stripes-page)"/>
  <rect x="1" y="1" width="498" height="718" fill="none" stroke="#F2EEE3" stroke-opacity="0.08" stroke-width="1"/>

  <!-- fake panel grid, suggests layout without revealing content -->
  <g fill="#121014" stroke="#F2EEE3" stroke-opacity="0.06">
    <rect x="24" y="24" width="452" height="220" rx="4"/>
    <rect x="24" y="256" width="216" height="200" rx="4"/>
    <rect x="260" y="256" width="216" height="200" rx="4"/>
    <rect x="24" y="468" width="452" height="228" rx="4"/>
  </g>

  <!-- DEV badge -->
  <g transform="translate(24,24) translate(-8,-8)">
    <rect width="52" height="24" rx="12" fill="#8E3154" fill-opacity="0.2"/>
    <text x="26" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5" fill="#C96E90">DEV</text>
  </g>

  <!-- centered label over the panel grid -->
  <g>
    <rect x="130" y="330" width="240" height="76" rx="6" fill="#0B0A0D" fill-opacity="0.82"/>
    <text x="250" y="360" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="600" letter-spacing="2" fill="#F2EEE3">NOCTRA</text>
    <text x="250" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#A9A3A9">Halaman disembunyikan</text>
    <text x="250" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7D7783">Mode pengembangan</text>
  </g>
</svg>
