<svg viewBox="0 0 500 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kura Chapter Page Placeholder">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F17" />
      <stop offset="50%" stop-color="#141624" />
      <stop offset="100%" stop-color="#191B2C" />
    </linearGradient>

    <!-- Kura Brand Gradient -->
    <linearGradient id="kuraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7654" />
      <stop offset="100%" stop-color="#E8613C" />
    </linearGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#E8613C" stop-opacity="0.25" />
    </linearGradient>

    <!-- Ambient Blur Filters -->
    <filter id="ambientBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="75" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. Deep Atmosphere Base -->
  <rect width="500" height="750" fill="url(#bgGrad)" />

  <!-- 2. Ambient Blurred Light Orbs (Noctra-Free Soft Glass Glow) -->
  <g filter="url(#ambientBlur)">
    <!-- Warm Vermilion Glow (Top-Right) -->
    <circle cx="380" cy="180" r="170" fill="#E8613C" fill-opacity="0.22" />
    <!-- Deep Indigo Glow (Bottom-Left) -->
    <circle cx="120" cy="580" r="180" fill="#4F46E5" fill-opacity="0.2" />
    <!-- Subtle Cyan Accent (Center-Left) -->
    <circle cx="150" cy="300" r="110" fill="#0EA5E9" fill-opacity="0.1" />
  </g>

  <!-- 3. Giant Kura Kanji Watermark (Subtle Brand Aura) -->
  <text x="250" y="460" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="340" font-weight="900" fill="#FFFFFF" fill-opacity="0.022" letter-spacing="-10">蔵</text>

  <!-- 4. Subtle Ambient Grid Mesh Pattern -->
  <g stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1">
    <line x1="125" y1="0" x2="125" y2="750" />
    <line x1="250" y1="0" x2="250" y2="750" />
    <line x1="375" y1="0" x2="375" y2="750" />
    <line x1="0" y1="187" x2="500" y2="187" />
    <line x1="0" y1="375" x2="500" y2="375" />
    <line x1="0" y1="562" x2="500" y2="562" />
  </g>

  <!-- 5. Central Frosted Glass Container -->
  <g filter="url(#cardShadow)">
    <rect x="90" y="185" width="320" height="380" rx="26" fill="#151726" fill-opacity="0.65" stroke="url(#glassBorder)" stroke-width="1.2" />
    <!-- Glass Highlight Sheen (Top Curve) -->
    <path d="M 91,211 A 26,26 0 0,1 117,186 L 383,186 A 26,26 0 0,1 409,211 L 409,250 C 330,228 170,234 91,250 Z" fill="#FFFFFF" fill-opacity="0.04" />
  </g>

  <!-- 6. Category Pill Badge -->
  <g transform="translate(250, 238)">
    <rect x="-60" y="-13" width="120" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
    <circle cx="-42" cy="0" r="4" fill="#E8613C" />
    <text x="-28" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" letter-spacing="1">CHAPTER</text>
  </g>

  <!-- 7. Central Manga Panel Hexagon Emblem (Kura Crest Motif) -->
  <g transform="translate(250, 335)">
    <!-- Hexagon Outer Aura Glow -->
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="#E8613C" fill-opacity="0.25" filter="url(#softGlow)" />
    <!-- Hexagon Outer Stroke -->
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25" fill="#12131F" fill-opacity="0.8" stroke="url(#kuraGradient)" stroke-width="2.2" stroke-linejoin="round" />
    <!-- Manga Multi-Panel Layout Icon -->
    <g stroke="url(#kuraGradient)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Outer Frame of Page -->
      <rect x="-18" y="-18" width="36" height="36" rx="4" />
      <!-- Horizontal Split -->
      <line x1="-18" y1="2" x2="18" y2="2" />
      <!-- Vertical Split (Top Panel) -->
      <line x1="2" y1="-18" x2="2" y2="2" />
      <!-- Mini Artwork Lines inside panels -->
      <line x1="-12" y1="-8" x2="-4" y2="-8" stroke-opacity="0.6" stroke-width="1.6" />
      <line x1="8" y1="-8" x2="12" y2="-8" stroke-opacity="0.6" stroke-width="1.6" />
      <line x1="-10" y1="12" x2="10" y2="12" stroke-opacity="0.6" stroke-width="1.6" />
    </g>
  </g>

  <!-- 8. Typography & State Label -->
  <text x="250" y="458" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="700" letter-spacing="4" fill="#FFFFFF">K U R A</text>
  <text x="250" y="488" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#94A3B8" letter-spacing="0.5">Pratinjau Bab Bacaan</text>

  <!-- Outer Border Frame -->
  <rect x="0.5" y="0.5" width="499" height="749" rx="0" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />
</svg>
