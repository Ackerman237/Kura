<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sampul disembunyikan, mode pengembangan" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="stripes-cover" width="40" height="40" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#0B0A0D"/>
      <rect width="2" height="40" fill="#8E3154" opacity="0.07"/>
    </pattern>
    <linearGradient id="vignette-cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0A0D" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0B0A0D" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="400" height="600" fill="url(#stripes-cover)"/>
  <rect width="400" height="600" fill="url(#vignette-cover)"/>
  <rect x="1" y="1" width="398" height="598" fill="none" stroke="#F2EEE3" stroke-opacity="0.08" stroke-width="1"/>

  <!-- DEV badge -->
  <g transform="translate(16,16)">
    <rect width="52" height="24" rx="12" fill="#8E3154" fill-opacity="0.16"/>
    <text x="26" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5" fill="#C96E90">DEV</text>
  </g>

  <!-- eye-off icon -->
  <g transform="translate(170,255)" stroke="#7D7783" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12c3-6 9-10 18-10s15 4 18 10c-1.2 2.3-2.8 4.4-4.7 6.1M14.1 17.6A10 10 0 0 1 2 12"/>
    <path d="M9.5 9.5A6 6 0 0 0 20.4 15"/>
    <line x1="1" y1="1" x2="39" y2="27"/>
  </g>

  <text x="200" y="330" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" letter-spacing="2" fill="#F2EEE3">NOCTRA</text>
  <text x="200" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#A9A3A9">Sampul disembunyikan</text>
  <text x="200" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7D7783">Mode pengembangan</text>
</svg>
