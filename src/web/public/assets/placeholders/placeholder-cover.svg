<svg viewBox="0 0 400 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kura Manga Cover Placeholder">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F17" />
      <stop offset="50%" stop-color="#141624" />
      <stop offset="100%" stop-color="#191B2C" />
    </linearGradient>

    <!-- Kura Brand Gradient -->
    <linearGradient id="kuraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7654" />
      <stop offset="100%" stop-color="#E8613C" />
    </linearGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#E8613C" stop-opacity="0.25" />
    </linearGradient>

    <!-- Ambient Blur Filters -->
    <filter id="ambientBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="65" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. Deep Atmosphere Base -->
  <rect width="400" height="560" fill="url(#bgGrad)" />

  <!-- 2. Ambient Blurred Light Orbs (Noctra-Free Soft Glass Glow) -->
  <g filter="url(#ambientBlur)">
    <!-- Warm Vermilion Glow (Top-Left) -->
    <circle cx="100" cy="120" r="140" fill="#E8613C" fill-opacity="0.22" />
    <!-- Deep Indigo Glow (Bottom-Right) -->
    <circle cx="300" cy="440" r="150" fill="#4F46E5" fill-opacity="0.2" />
    <!-- Subtle Cyan Accent (Center-Right) -->
    <circle cx="280" cy="220" r="90" fill="#0EA5E9" fill-opacity="0.1" />
  </g>

  <!-- 3. Giant Kura Kanji Watermark (Subtle Brand Aura) -->
  <text x="200" y="340" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="280" font-weight="900" fill="#FFFFFF" fill-opacity="0.022" letter-spacing="-8">蔵</text>

  <!-- 4. Subtle Ambient Grid Mesh Pattern -->
  <g stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="560" />
    <line x1="200" y1="0" x2="200" y2="560" />
    <line x1="300" y1="0" x2="300" y2="560" />
    <line x1="0" y1="140" x2="400" y2="140" />
    <line x1="0" y1="280" x2="400" y2="280" />
    <line x1="0" y1="420" x2="400" y2="420" />
  </g>

  <!-- 5. Central Frosted Glass Container -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="110" width="280" height="340" rx="24" fill="#151726" fill-opacity="0.65" stroke="url(#glassBorder)" stroke-width="1.2" />
    <!-- Glass Highlight Sheen (Top Curve) -->
    <path d="M 61,134 A 24,24 0 0,1 85,111 L 315,111 A 24,24 0 0,1 339,134 L 339,170 C 270,150 130,154 61,170 Z" fill="#FFFFFF" fill-opacity="0.04" />
  </g>

  <!-- 6. Category Pill Badge -->
  <g transform="translate(200, 158)">
    <rect x="-56" y="-12" width="112" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
    <circle cx="-38" cy="0" r="4" fill="#E8613C" />
    <text x="-26" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0" letter-spacing="1">MANGA</text>
  </g>

  <!-- 7. Central Book Hexagon Emblem (Kura Crest Motif) -->
  <g transform="translate(200, 245)">
    <!-- Hexagon Outer Aura Glow -->
    <polygon points="0,-48 41.6,-24 41.6,24 0,48 -41.6,24 -41.6,-24" fill="#E8613C" fill-opacity="0.25" filter="url(#softGlow)" />
    <!-- Hexagon Outer Stroke -->
    <polygon points="0,-46 39.8,-23 39.8,23 0,46 -39.8,23 -39.8,-23" fill="#12131F" fill-opacity="0.8" stroke="url(#kuraGradient)" stroke-width="2.2" stroke-linejoin="round" />
    <!-- Book / Comic Icon -->
    <g stroke="url(#kuraGradient)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -16, -10 C -11,-13 -4,-13 0,-8 C 4,-13 11,-13 16,-10 L 16, 12 C 11,9 4,9 0, 14 C -4,9 -11,9 -16, 12 Z" />
      <line x1="0" y1="-8" x2="0" y2="14" />
      <line x1="-11" y1="-4" x2="-4" y2="-4" stroke-opacity="0.7" stroke-width="1.8" />
      <line x1="-11" y1="2" x2="-4" y2="2" stroke-opacity="0.7" stroke-width="1.8" />
      <line x1="4" y1="-4" x2="11" y2="-4" stroke-opacity="0.7" stroke-width="1.8" />
      <line x1="4" y1="2" x2="11" y2="2" stroke-opacity="0.7" stroke-width="1.8" />
    </g>
  </g>

  <!-- 8. Typography & State Label -->
  <text x="200" y="355" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#FFFFFF">K U R A</text>
  <text x="200" y="382" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" letter-spacing="0.5">Pratinjau Sampul Komik</text>

  <!-- Outer Border Frame -->
  <rect x="0.5" y="0.5" width="399" height="559" rx="0" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />
</svg>
