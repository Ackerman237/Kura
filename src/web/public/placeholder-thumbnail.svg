<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="No Thumbnail Available">
  <defs>
    <linearGradient id="kuraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#141722" />
    </linearGradient>

    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="640" height="360" fill="url(#kuraBg)" />

  <!-- Subtle Ambient Glow -->
  <g filter="url(#ambientGlow)">
    <circle cx="320" cy="150" r="100" fill="#d97706" fill-opacity="0.11" />
    <circle cx="480" cy="220" r="80" fill="#1e293b" fill-opacity="0.35" />
  </g>

  <!-- Central Frosted Glass Card -->
  <g filter="url(#cardShadow)">
    <rect x="140" y="55" width="360" height="250" rx="16" fill="#151821" fill-opacity="0.75" stroke="url(#glassBorder)" stroke-width="1.2" />
  </g>

  <!-- Video Play / Filmstrip Emblem -->
  <g transform="translate(320, 140)">
    <circle cx="0" cy="0" r="32" fill="#1e222d" stroke="url(#glassBorder)" stroke-width="1" />
    <!-- Play Triangle with Amber Stroke -->
    <polygon points="-8,-14 16,0 -8,14" fill="url(#amberAccent)" />
  </g>

  <!-- Text Hierarchy -->
  <text x="320" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="2.5">NO THUMBNAIL</text>
  <text x="320" y="248" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#9ca3af" letter-spacing="0.5">Thumbnail Tidak Tersedia</text>

  <!-- Minimal Tag -->
  <rect x="280" y="270" width="80" height="20" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <text x="320" y="284" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#d97706" letter-spacing="1.5">SINEMA</text>

  <!-- Outer Border Frame -->
  <rect x="0.5" y="0.5" width="639" height="359" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
</svg>
